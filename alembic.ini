[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
# Separated installations inject DATABASE_MIGRATION_URL only through database_admin.py.
# Legacy installations use DATABASE_URL through app.config.settings.
# Do not place database credentials in this committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
