services:
  postgres:
    # Locally built OS/gosu refresh; upstream inputs are digest-pinned in the recipe.
    # Never pull this first-party name from a public registry.
    image: fruitcake/postgres-vector:16.15-pgvector0.8.7-20261018-r1
    pull_policy: never
    build:
      context: .
      dockerfile: containers/postgres/Dockerfile
    environment:
      POSTGRES_DB: fruitcake_v5
      POSTGRES_USER: fruitcake
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fruitcake}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruitcake -d fruitcake_v5"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis is optional — enable in Phase 2 when caching is needed
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  # redisdata:
