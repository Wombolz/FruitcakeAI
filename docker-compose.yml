services:
  postgres:
    # PostgreSQL 16.15 + pgvector 0.8.7; update only after backup/restore testing.
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: fruitcake_v5
      POSTGRES_USER: fruitcake
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fruitcake}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruitcake -d fruitcake_v5"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis is optional — enable in Phase 2 when caching is needed
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redisdata:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  # redisdata:
